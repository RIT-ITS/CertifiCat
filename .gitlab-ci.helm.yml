image: curlimages/curl:latest

package_helm:
  stage: package_helm
  image: alpine/helm:latest
  needs:
    - version
  artifacts:
    untracked: true
  script:
    - "apk update && apk add envsubst && ./internal/build-chart"
  rules:
    - !reference [.release, rules]

upload_helm:
  stage: upload_helm
  image: curlimages/curl:latest
  needs:
    - package_helm
    # Don't publish a chart that points at an image that doesn't exist yet
    - job: build
      artifacts: false
  script:
    - 'cd ./dist/charts ; ls; FN=`ls certificat*tgz` ; curl --request POST --user gitlab-ci-token:$CI_JOB_TOKEN --form chart=@$FN "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"'
  rules:
    - !reference [.release, rules]
